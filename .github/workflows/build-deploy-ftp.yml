name: Build and deploy React Native Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-native-web-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Mostrar versiones
        run: |
          node --version
          npm --version

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Compilar aplicación web
        run: npm run build

      - name: Verificar archivos generados
        run: |
          test -d dist
          test -f dist/index.html
          test -d dist/assets
          ls -la dist
          ls -la dist/assets

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Iniciar vista previa
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid

      - name: Esperar servidor
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/vite-preview.log
          exit 1

      - name: Probar aplicación en navegador
        run: node scripts/smoke-test.mjs

      - name: Desplegar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist/
          server-dir: /reactnative.dbasure.com/
          dangerous-clean-slate: false